databaseChangeLog:
  - changeSet:
      id: v014-create-user-permission-table
      author: tricol-security
      changes:
        - createTable:
            tableName: user_permission
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: granted
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: modified_by
                  type: VARCHAR(50)
        
        - addUniqueConstraint:
            tableName: user_permission
            columnNames: user_id, permission_id
            constraintName: uk_user_permission
        
        - addForeignKeyConstraint:
            baseTableName: user_permission
            baseColumnNames: user_id
            referencedTableName: user_app
            referencedColumnNames: id
            constraintName: fk_user_permission_user
            onDelete: CASCADE
        
        - addForeignKeyConstraint:
            baseTableName: user_permission
            baseColumnNames: permission_id
            referencedTableName: permission
            referencedColumnNames: id
            constraintName: fk_user_permission_permission
            onDelete: CASCADE
