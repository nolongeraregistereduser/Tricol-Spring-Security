databaseChangeLog:
  - changeSet:
      id: v015-create-refresh-token-table
      author: tricol-security
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expiry_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: revoked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        
        - addForeignKeyConstraint:
            baseTableName: refresh_token
            baseColumnNames: user_id
            referencedTableName: user_app
            referencedColumnNames: id
            constraintName: fk_refresh_token_user
            onDelete: CASCADE
        
        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token_token
            columns:
              - column:
                  name: token
