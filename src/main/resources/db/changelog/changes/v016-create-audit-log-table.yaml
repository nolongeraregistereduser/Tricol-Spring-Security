databaseChangeLog:
  - changeSet:
      id: v016-create-audit-log-table
      author: tricol-security
      changes:
        - createTable:
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: username
                  type: VARCHAR(50)
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: resource
                  type: VARCHAR(50)
              - column:
                  name: resource_id
                  type: BIGINT
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: details
                  type: TEXT
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        
        - createIndex:
            tableName: audit_log
            indexName: idx_audit_user_id
            columns:
              - column:
                  name: user_id
        
        - createIndex:
            tableName: audit_log
            indexName: idx_audit_timestamp
            columns:
              - column:
                  name: timestamp
        
        - createIndex:
            tableName: audit_log
            indexName: idx_audit_action
            columns:
              - column:
                  name: action
